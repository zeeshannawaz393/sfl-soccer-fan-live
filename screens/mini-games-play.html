<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SFL — Mini-Games (Playable)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --arena:#080A10;--panel:#141922;--panel2:#1C2330;--panel3:#252E3D;
    --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.15);
    --t1:#F2F5FA;--t2:#98A2B3;--t3:#5A6472;
    --volt:#C9FF3D;--voltDim:#8FBF2E;
    --coin1:#FFD54F;--coin2:#FFB300;--coinDeep:#8A5A0E;
    --bonus1:#38E0D0;--bonus2:#12B5A8;--bonusDeep:#0A6E66;
    --wheelP:#8A5CF6;--wheelB:#2F7FD1;
    --amber:#FFA31A;--coral:#FF3B5F;--green:#2FCB6E;
  }
  html,body{height:100%}
  body{background:#0B0E14;background-image:radial-gradient(56% 30% at 12% 0%,rgba(201,255,61,.10),transparent 60%),radial-gradient(48% 30% at 90% 5%,rgba(138,92,246,.14),transparent 60%);color:var(--t1);font-family:'Manrope',-apple-system,'Segoe UI',system-ui,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px 16px 40px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .stage-head{text-align:center;max-width:430px}
  .stage-head .kicker{font-size:12px;font-weight:800;letter-spacing:4px;color:var(--volt);text-transform:uppercase}
  .stage-head h1{font-size:23px;font-weight:800;letter-spacing:-.5px;color:#fff;margin-top:6px}
  .stage-head p{font-size:12.5px;line-height:18px;font-weight:600;color:var(--t2);margin-top:8px}

  .phone{width:390px;height:844px;flex:none;border-radius:46px;overflow:hidden;position:relative;background:var(--arena);display:flex;flex-direction:column;box-shadow:0 44px 96px rgba(0,0,0,.55);border:1px solid #262C38}
  .top{padding:18px 20px 0;display:flex;align-items:center;gap:12px;flex:none}
  .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:none;cursor:pointer;transition:transform .1s,background .15s}
  .back:active{transform:scale(.9)}
  .htitle{font-size:19px;font-weight:800;letter-spacing:-.4px;color:#fff}
  .body{flex:1;padding:14px 18px 0;display:flex;flex-direction:column;overflow:hidden}
  .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .h1{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.6px;color:#fff}
  .sub{font-size:13.5px;line-height:20px;font-weight:600;color:var(--t2);margin-top:8px}
  .lbl{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--t3);text-transform:uppercase}
  .cta{margin-top:auto;padding:14px 0 22px;display:flex;flex-direction:column;gap:9px;flex:none}
  .altlink{font-size:13.5px;font-weight:750;color:var(--t2);text-align:center;cursor:pointer}
  .altlink:active{color:#fff}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px}

  .btn{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;font-weight:800;color:#0A1400;background:var(--volt);box-shadow:0 12px 26px rgba(201,255,61,.24);cursor:pointer;user-select:none;transition:transform .1s,filter .15s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.coin{background:linear-gradient(140deg,var(--coin1),var(--coin2));color:#4A3200;box-shadow:0 12px 26px rgba(255,179,0,.26)}
  .btn.purple{background:linear-gradient(140deg,var(--wheelP),#6A3CD6);color:#fff;box-shadow:0 12px 26px rgba(138,92,246,.3)}
  .btn.ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line2);box-shadow:none}
  .btn.dis{background:rgba(255,255,255,.05);color:var(--t3);box-shadow:none;pointer-events:none;opacity:.7}
  .btn.sm{height:44px;font-size:13.5px;border-radius:12px}

  .gc,.gb{width:22px;height:22px;font-size:12px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
  .gc{color:#5A3E00;background:radial-gradient(circle at 35% 28%,#FFE99A,var(--coin2) 55%,#C88A00);box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
  .gb{color:#04302C;background:radial-gradient(circle at 35% 28%,#9CF5EC,var(--bonus2) 60%,#0A6E66);box-shadow:inset 0 1px 2px rgba(255,255,255,.5)}
  .balbar{display:flex;gap:9px}
  .balchip{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
  .balchip .bv{font-size:15px;font-weight:800;color:#fff;line-height:1}
  .balchip .bk{font-size:9.5px;font-weight:750;color:var(--t2)}
  .balchip.ticket{background:linear-gradient(150deg,#122015,#0d1119);border-color:rgba(201,255,61,.28)}
  .balchip.ticket .bv{color:var(--volt)}

  .tile{border-radius:20px;overflow:hidden;position:relative;height:196px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);cursor:pointer;transition:transform .12s}
  .tile:active{transform:scale(.985)}
  .tile.penalty{background:linear-gradient(to top,rgba(6,10,16,.96),rgba(6,10,16,.15)),linear-gradient(155deg,#0d2417,#0a1a12)}
  .tile.wheel{background:linear-gradient(150deg,#241546,#141922)}
  .tile .tclass{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid var(--line2);color:#fff}
  .tile .tcost{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:linear-gradient(140deg,var(--coin1),var(--coin2));color:#4A3200}
  .tile .ti{padding:0 16px 12px;position:relative;z-index:2}
  .tile .tn{font-size:19px;font-weight:800;letter-spacing:-.3px;color:#fff}
  .tile .tp{font-size:12.5px;font-weight:700;color:var(--volt);margin-top:2px}
  .tile.wheel .tp{color:#C9B6FF}
  .tile .tplay{position:absolute;right:14px;bottom:14px;height:40px;padding:0 18px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;background:var(--volt);color:#0A1400}
  .tile.wheel .tplay{background:linear-gradient(140deg,var(--wheelP),#6A3CD6);color:#fff}
  .tile .bigemoji{position:absolute;left:16px;bottom:52px;font-size:40px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
  .miniwheel{position:absolute;right:-34px;top:24px;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--wheelP) 0 45deg,var(--wheelB) 45deg 90deg,var(--coin2) 90deg 135deg,var(--wheelP) 135deg 180deg,var(--wheelB) 180deg 225deg,var(--coin2) 225deg 270deg,var(--wheelP) 270deg 315deg,var(--wheelB) 315deg 360deg);border:4px solid rgba(255,255,255,.2);opacity:.85;animation:spin 9s linear infinite}

  .session{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .session .sc{flex:1;padding:11px 8px;text-align:center;border-right:1px solid var(--line)}
  .session .sc:last-child{border-right:none}
  .session .sv{font-size:17px;font-weight:800;color:#fff}
  .session .sv.net{color:var(--volt)}
  .session .sl{font-size:9px;font-weight:750;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

  .note{display:block;border-radius:13px;padding:12px 14px;font-size:12px;line-height:18px;font-weight:700}
  .note.info{background:rgba(47,127,209,.12);border:1px solid rgba(47,127,209,.3);color:#8FC0F0}
  .note.bonus{background:rgba(56,224,208,.09);border:1px solid rgba(56,224,208,.3);color:var(--bonus1)}
  .note.amber{background:rgba(255,163,26,.1);border:1px solid rgba(255,163,26,.3);color:var(--amber)}

  .kv{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--t2);font-weight:650}.kv .v{margin-left:auto;font-weight:800;color:#fff}
  .kv .v.coin{color:var(--coin1)}.kv .v.bonus{color:var(--bonus1)}.kv .v.minus{color:var(--coral)}.kv .v.plus{color:var(--volt)}
  .settlecard{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 16px;text-align:left}

  /* ================= PENALTY ================= */
  .pfield{position:relative;height:330px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:
      radial-gradient(120% 60% at 50% 0%,rgba(120,180,255,.10),transparent 60%),
      linear-gradient(to bottom,#0c2c1b 0%,#12492e 40%,#0e3822 75%,#0a2417 100%);
    touch-action:none;cursor:pointer;user-select:none}
  .pfield::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 26px,transparent 26px 52px);transform:perspective(300px) rotateX(42deg);transform-origin:bottom;pointer-events:none}
  .goalbox{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:280px;height:130px;z-index:2}
  .goalbox .posts{position:absolute;inset:0;border:6px solid #fff;border-bottom:none;border-radius:5px 5px 0 0;box-shadow:0 0 18px rgba(255,255,255,.15)}
  .goalbox .net{position:absolute;inset:6px 6px 0 6px;background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.13) 15px 16px),repeating-linear-gradient(0deg,transparent 0 15px,rgba(255,255,255,.13) 15px 16px);transition:transform .12s}
  .goalbox.bulge .net{transform:scale(1.06) translateY(4px)}
  .reticle{position:absolute;z-index:7;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;opacity:0}
  .reticle.show{opacity:1}
  .reticle i{position:absolute;inset:0;border:2px solid var(--volt);border-radius:50%;box-shadow:0 0 12px rgba(201,255,61,.5)}
  .reticle::before,.reticle::after{content:"";position:absolute;background:var(--volt)}
  .reticle::before{left:50%;top:3px;bottom:3px;width:2px;margin-left:-1px}
  .reticle::after{top:50%;left:3px;right:3px;height:2px;margin-top:-1px}
  .cring{position:absolute;z-index:7;border-radius:50%;border:2.5px solid var(--volt);pointer-events:none;transform:translate(-50%,-50%);opacity:0}
  .cring.show{opacity:1}
  .cring.ok{border-color:var(--green)}
  .cring.hot{border-color:var(--coral)}
  .keeper{position:absolute;z-index:5;font-size:40px;width:44px;height:44px;text-align:center;line-height:44px;transition:left .38s cubic-bezier(.2,.7,.2,1.15),top .38s cubic-bezier(.2,.7,.2,1.15),transform .38s ease;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .pball{position:absolute;z-index:8;font-size:30px;width:32px;height:32px;text-align:center;line-height:32px;transition:opacity .15s}
  .pgauge{position:absolute;right:12px;bottom:70px;top:58px;width:26px;border-radius:14px;background:#0a0e12;border:2px solid rgba(255,255,255,.35);overflow:hidden;z-index:6;opacity:0;transition:opacity .2s}
  .pgauge .fill{position:absolute;left:-3px;right:-3px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff;bottom:0}
  .pgauge .safe{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(#2FCB6E,#1a8f46)}
  .pgauge .mid{position:absolute;left:0;right:0;bottom:58%;height:24%;background:linear-gradient(#FFD54F,#E09A2C)}
  .pgauge .hotz{position:absolute;left:0;right:0;bottom:82%;height:18%;background:linear-gradient(#FF3B5F,#B4241B)}
  .pgauge.show{opacity:1}
  .pball.idle{animation:pbbob 1.15s ease-in-out infinite}
  @keyframes pbbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .pprompt{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;font-weight:800;color:#fff;z-index:8;text-shadow:0 1px 6px rgba(0,0,0,.9);letter-spacing:.2px}
  .pflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(201,255,61,.35),transparent 60%);opacity:0;z-index:4;pointer-events:none}
  .pflash.on{animation:pflash .5s ease}
  @keyframes pflash{0%{opacity:1}100%{opacity:0}}

  /* ================= WHEEL ================= */
  .wheelwrap{position:relative;width:262px;height:262px;margin:6px auto;touch-action:none}
  .wheelptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--volt);z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));transform-origin:50% 0}
  .wheelptr.tick{animation:ptrtick .09s ease}
  @keyframes ptrtick{0%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-13deg)}100%{transform:translateX(-50%) rotate(0)}}
  .wheeldisc{width:262px;height:262px;border-radius:50%;border:6px solid var(--panel3);box-shadow:0 0 0 4px rgba(201,255,61,.25),0 0 40px rgba(138,92,246,.3);position:relative;cursor:grab;
    background:conic-gradient(var(--wheelP) 0 45deg,#1E5E9E 45deg 90deg,var(--coin2) 90deg 135deg,#6A3CD6 135deg 180deg,var(--wheelB) 180deg 225deg,#B8860B 225deg 270deg,#4A2E9E 270deg 315deg,var(--bonus2) 315deg 360deg)}
  .wheeldisc.grabbing{cursor:grabbing}
  .wheelseg{position:absolute;top:0;left:0;width:100%;height:100%}
  .wheelseg span{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
  .wheelhub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--panel);border:3px solid var(--volt);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2;pointer-events:none}
  .wheelhint{text-align:center;font-size:11.5px;font-weight:750;color:var(--t3);margin-top:-2px}
  .prizetable{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .pt{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 5px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,box-shadow .12s}
  .pt .sw{display:none}
  .pt .wlogo{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-style:normal;font-weight:900;background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .pt.hit{transform:scale(1.06);box-shadow:0 0 0 2px #fff,0 0 16px rgba(201,255,61,.5)}
  .wforce.lock .wforce-rail{box-shadow:0 0 0 2px rgba(201,255,61,.4)}
  .wforce.lock b{background:var(--volt);box-shadow:0 0 14px var(--volt)}
  .wforce{margin:8px 2px 2px;display:flex;align-items:center;gap:8px}
  .wforce .wl{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--volt)}
  .wforce-rail{flex:1;height:16px;border-radius:999px;position:relative;overflow:hidden;border:1.5px solid rgba(255,255,255,.28);background:#0a0e12;
    background-image:linear-gradient(90deg,#1a8f46 0 58%,#E09A2C 58% 82%,#B4241B 82% 100%)}
  .wforce-rail b{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff;left:50%}

  .odds{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .oddr{display:flex;padding:10px 13px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line);background:var(--panel)}
  .oddr:last-child{border-bottom:none}
  .oddr.head{background:var(--panel2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);font-weight:800}
  .oddr .c1{flex:2;color:#fff}.oddr .c2{flex:1;text-align:right;color:var(--t2)}.oddr .c3{flex:1;text-align:right;color:var(--volt);font-weight:800}
  .rtp{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(201,255,61,.08);border:1px solid rgba(201,255,61,.25);border-radius:12px;padding:11px;font-size:13px;font-weight:800;color:var(--volt)}

  .celebrate{align-items:center;text-align:center;display:flex;flex-direction:column;justify-content:center;flex:1;padding-bottom:20px}
  .rsic{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;animation:pop .5s ease}
  .rsic.goal{background:radial-gradient(circle at 40% 35%,rgba(201,255,61,.35),rgba(201,255,61,.1));border:2px solid rgba(201,255,61,.5)}
  .rsic.saved{background:rgba(255,255,255,.06);border:2px solid var(--line2)}
  .rsic.bonus{background:radial-gradient(circle at 40% 35%,rgba(56,224,208,.3),rgba(56,224,208,.08));border:2px solid rgba(56,224,208,.5)}
  .rsic.gift{background:radial-gradient(circle at 40% 35%,rgba(138,92,246,.32),rgba(138,92,246,.08));border:2px solid rgba(138,92,246,.55)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hi{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .hrow .hn{font-size:13.5px;font-weight:800;color:#fff}
  .hrow .hd{font-size:11px;font-weight:650;color:var(--t3);margin-top:1px;font-family:ui-monospace,monospace}
  .hrow .ha{margin-left:auto;text-align:right;font-size:15px;font-weight:800;color:var(--volt);display:flex;flex-direction:column}
  .hrow .ha.zero{color:var(--t3)}.hrow .ha.gift{color:var(--wheelP)}
  .hrow .ha .st{font-size:9.5px;font-weight:700;color:var(--t2);margin-top:1px}

  .kititem{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .kititem .ke{width:44px;height:44px;border-radius:11px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .kititem .kn{font-size:14px;font-weight:800;color:#fff}
  .kititem .kr{font-size:11px;font-weight:750;margin-top:1px}
  .empty{text-align:center;color:var(--t3);font-size:13px;font-weight:700;padding:40px 20px}

  .toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:rgba(20,25,34,.96);border:1px solid var(--line2);color:#fff;font-size:13px;font-weight:750;padding:11px 18px;border-radius:12px;z-index:50;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:300px;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .devbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .devbar button{font-size:11px;font-weight:750;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
  .devbar button:hover{color:#fff}
</style>
</head>
<body>

<div class="stage-head">
  <div class="kicker">Soccer Fan Live · Football Arcade</div>
  <h1>Mini-Games — Playable</h1>
  <p><b>Penalty</b> is a skill kick: drag in the goal to set your <b>angle</b>, then tap the bouncing bar to lock <b>power</b>. Red is too much. <b>Wheel</b> is a real flick: drag &amp; throw it, momentum and friction decide where it stops.</p>
</div>

<div class="phone">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
</div>

<div class="devbar">
  <button onclick="SFL.reset()">↺ Reset balances</button>
  <button onclick="SFL.giveCoins()">+500 Coins</button>
  <button onclick="SFL.go('history')">📜 History</button>
  <button onclick="SFL.go('kitbag')">🎒 Kit Bag</button>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  //  STATE
  // ============================================================
  var DEFAULT = {
    coins: 1240, bonus: 320, tickets: 1,
    playsToday: 4, dailyLimit: 20, freeSpin: 0,
    session: { plays:4, entry:80, gross:120 },
    history: [
      {icon:'⚽', name:'Penalty · Top corner', rnd:'RND-8841', entry:10, prize:50, kind:'plus', st:'Bonus · net +40'},
      {icon:'🎲', name:'Wheel · Kit gift',     rnd:'RND-8837', entry:20, prize:0,  kind:'gift', st:'→ Kit Bag'},
      {icon:'⚽', name:'Penalty · Saved',       rnd:'RND-8830', entry:10, prize:0,  kind:'zero', st:'net −10'},

  function layoutPenalty(){
    var f=el('pfield'), keeper=el('keeper'), ball=el('pball');
    if(!f||!keeper) return;
    var m=goalMetrics();
    keeper.style.left=(m.gl+m.gw/2-22)+'px'; keeper.style.top=(m.gt+m.gh*0.52)+'px'; keeper.style.transform='';
    ball.style.left=(f.clientWidth/2-16)+'px'; ball.style.top=(f.clientHeight-42)+'px'; ball.style.opacity='1'; ball.style.transform='scale(1)';
  }
  function goalMetrics(){
    var f=el('pfield'), gb=el('goalbox');
    var fr=f.getBoundingClientRect(), gr=gb.getBoundingClientRect();
    return { gl:gr.left-fr.left, gt:gr.top-fr.top, gw:gr.width, gh:gr.height };
  }
  function aimFromEvt(e){
    var f=el('pfield'), gb=el('goalbox'); if(!f||!gb) return {x:0.5,y:0.45};
    var fr=f.getBoundingClientRect(), gr=gb.getBoundingClientRect();
    var x=(e.clientX-fr.left-(gr.left-fr.left))/gr.width;
    var y=(e.clientY-fr.top-(gr.top-fr.top))/gr.height;
    return {x:clamp(x,-0.12,1.12), y:clamp(y,-0.12,1.12)};
  }
  function bindPenField(){
    var f=el('pfield'); if(!f||f._bound) return; f._bound=true;
    f.addEventListener('pointerdown',function(e){
      e.preventDefault(); try{f.setPointerCapture(e.pointerId);}catch(err){}
      if(pen.busy) return;
      if(pen.phase==='aim'){ pen.dragging=true; pen.moved=0; updatePenAim(e); }
      else if(pen.phase==='power'){ pen.phase='strike'; strike(); }
    });
    f.addEventListener('pointermove',function(e){
      if(e.pointerType==='mouse'&&!(e.buttons&1)) return;
      if(pen.phase==='aim'&&pen.dragging) updatePenAim(e);
    });
    function up(){
      if(pen.phase!=='aim'||!pen.dragging) return;
      pen.dragging=false;
      if(pen.moved<2){ setPrompt('1/2 · DRAG in the goal to set ANGLE'); return; }
      pen.phase='power'; pen.t0=performance.now();
      el('pgauge').classList.add('show');
      setPrompt('2/2 · TAP to lock POWER — mind the red');
      bouncePenPower();
    }
    f.addEventListener('pointerup',up); f.addEventListener('pointercancel',up);
  }
  function updatePenAim(e){
    var a=aimFromEvt(e); pen.aimX=a.x; pen.aimY=a.y; pen.moved++; pen.hist.push({t:performance.now(),x:a.x,y:a.y}); if(pen.hist.length>40) pen.hist.shift();
    var m=goalMetrics(), r=el('reticle');
    if(r){ r.style.left=(m.gl+clamp(a.x,-0.12,1.12)*m.gw)+'px'; r.style.top=(m.gt+clamp(a.y,-0.12,1.12)*m.gh)+'px'; r.classList.add('show'); }
  }
  function bouncePenPower(){
    if(pen.phase!=='power') return;
    var t=(performance.now()-pen.t0)/1000, cyc=(t*1.45)%2, p=cyc<1?cyc:2-cyc;
    pen.power=0.10+p*0.90;
    pen.comp=pen.power>0.86?0.7:pen.power<0.22?0.55:0.22;
    var fill=el('pfill'); if(fill) fill.style.bottom=(pen.power*100)+'%';
    reqRaf(bouncePenPower);
  }

  function strike(){
    if(pen.busy) return; pen.busy=true;
    if(S.coins<10 && S.tickets<=0){ go('insufficient'); return; }
    if(S.playsToday>=S.dailyLimit){ go('limit'); return; }
    pen.useTicket = (S.coins<10 && S.tickets>0);
    if(pen.useTicket){ S.tickets--; } else { S.coins-=10; }
    var pc=el('pcoins'); if(pc) pc.textContent=fmt(S.coins);

    var m=goalMetrics(), ball=el('pball'), keeper=el('keeper');
    var r=el('reticle'), c=el('cring'), g=el('pgauge');
    if(r) r.classList.remove('show'); if(c) c.classList.remove('show'); if(g) g.classList.remove('show');
    setPrompt('');

    var aimX=pen.aimX, aimY=pen.aimY, power=pen.power, comp=pen.comp;
    var scatter=comp*0.16+Math.max(0,power-0.82)*0.24;
    var fx=aimX+(Math.random()-0.5)*scatter*2, fy=aimY+(Math.random()-0.5)*scatter*1.5;
    var now=performance.now(), older=null;
    for(var i=pen.hist.length-1;i>=0;i--){ if(now-pen.hist[i].t>160){ older=pen.hist[i]; break; } }
    var src=older||{x:aimX,y:aimY};
    var flick=older&&(Math.abs(older.x-aimX)>0.14||Math.abs(older.y-aimY)>0.14);
    var readP=flick?0.28:0.52;
    var kxN, kyN;
    if(Math.random()>readP){ kxN=src.x<0.5?0.64+Math.random()*0.26:0.08+Math.random()*0.26; kyN=0.28+Math.random()*0.48; }
    else { kxN=clamp(src.x+(Math.random()-0.5)*0.14,0.06,0.94); kyN=clamp(src.y+(Math.random()-0.5)*0.16,0.08,0.92); }
    var over=false, wide=false;
    if(fy<-0.04||(power>0.93&&fy<0.18&&Math.random()<0.5+comp*0.3)) over=true;
    else if(fx<-0.03||fx>1.03) wide=true;
    fx=clamp(fx,-0.08,1.08); fy=clamp(fy,-0.12,1.08);
    var corner=Math.min(Math.min(fx,1-fx),Math.min(fy,1-fy));
    var reach=0.20-power*0.05-(0.12-Math.min(0.12,corner))*1.1;
    if(fy>0.32&&fy<0.68) reach+=0.05;
    var dx=fx-kxN, dy=(fy-kyN)*0.72, dist=Math.sqrt(dx*dx+dy*dy);
    var panenka=power<0.42&&Math.abs(aimX-0.5)<0.14&&aimY>0.28&&aimY<0.72;
    var out;
    if(over) out={key:'missed',label:'Over the bar',prize:0,miss:'over'};
    else if(wide) out={key:'missed',label:'Wide',prize:0,miss:'wide'};
    else if(dist<reach) out={key:'saved',label:'Saved',prize:0};
    else if(panenka) out={key:'great',label:'Panenka',prize:20};
    else if(corner<0.11&&power>0.52&&dist>0.26) out={key:'topcorner',label:'Top corner',prize:50};
    else if(dist>0.26||corner<0.16) out={key:'great',label:'Great finish',prize:20};
    else out={key:'standard',label:'Standard goal',prize:10};

    var tx=m.gl+(wide?(aimX<0.5?-0.04:1.04):fx)*m.gw-16;
    var ty=over?(m.gt-40):(m.gt+fy*m.gh-10);
    keeper.style.left=(m.gl+kxN*m.gw-22)+'px'; keeper.style.top=(m.gt+kyN*m.gh-10)+'px';
    keeper.style.transform='rotate('+(kxN<0.5?-28:28)+'deg) scale(1.1)';

    var sx=parseFloat(ball.style.left), sy=parseFloat(ball.style.top);
    var dur=620, t0=null, arc=panenka?110:80+power*40;
    function fly(ts){
      if(!t0)t0=ts; var t=clamp((ts-t0)/dur,0,1);
      ball.style.left=(sx+(tx-sx)*t)+'px'; ball.style.top=(sy+(ty-sy)*t-arc*Math.sin(Math.PI*t))+'px';
      ball.style.transform='scale('+(1-0.45*t)+')';
      if(t<1) reqRaf(fly); else impact(out);
    }
    reqRaf(fly);
  }

  function impact(out){
    var ball=el('pball'), gb=el('goalbox');

    var pt='';
    WHEEL.forEach(function(w){ pt+='<div class="pt" data-seg="'+w.key+'" style="background:'+w.color+'"><i class="wlogo">'+(icons[w.key]||'')+'</i>'+shorts[w.key]+'</div>'; });
    return head('Spin the Wheel','<div class="balchip" style="margin-left:auto;flex:none;padding:6px 10px"><div class="gc">C</div><div class="bv num" id="wcoins">'+fmt(S.coins)+'</div></div>')+
    '<div class="body"><div class="scroll">'+
      '<div class="wheelwrap" id="wheelwrap">'+
        '<div class="wheelptr" id="wptr"></div>'+
        '<div class="wheeldisc" id="disc" style="transform:rotate('+wheel.rot+'deg)">'+segs+'<div class="wheelhub">⚽</div></div>'+
      '</div>'+
      '<div class="wforce"><span class="wl">FORCE</span><div class="wforce-rail"><b id="wneedle"></b></div><span class="wl">MAX</span></div>'+
      '<div class="wheelhint" id="whint">TAP Spin to lock FORCE — or drag the wheel and throw it</div>'+
      '<div class="prizetable">'+pt+'</div>'+
    '</div>'+
    '<div class="cta" style="margin-top:0"><div class="btn purple" id="spinbtn" data-act="spin">'+(S.freeSpin>0?'Spin · FREE':'Spin · 20 Coins')+'</div></div></div>';
  };
  function shortLabel(w){ return w.type==='bonus'?'+'+w.value:w.type==='gift'?'🎁':w.type==='free'?'FREE':'—'; }

  AFTER.wheel = function(){
    var disc=el('disc'), wrap=el('wheelwrap'); if(!disc||!wrap) return;
    disc.style.transition='none';
    var W=wheel;
    function angOf(e){ var r=wrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; var p=(e.touches&&e.touches[0])||e; return Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI; }
    function down(e){
      if(W.busy) return;
      if(S.freeSpin<=0 && S.coins<20){ go('insufficient'); return; }
      W.dragging=true; W.lastAng=angOf(e); W.lastT=perf(); W.vel=0; W.moved=0;
      disc.classList.add('grabbing'); e.preventDefault();
    }
    function move(e){
      if(!W.dragging) return;
      var a=angOf(e), d=a-W.lastAng; if(d>180)d-=360; if(d<-180)d+=360;
      W.rot+=d; W.moved+=Math.abs(d); disc.style.transform='rotate('+W.rot+'deg)';
      var now=perf(), dt=now-W.lastT; if(dt>0) W.vel=d/dt*16;
      W.lastAng=a; W.lastT=now; e.preventDefault();
    }
    function up(e){
      if(!W.dragging) return;
      W.dragging=false; disc.classList.remove('grabbing');
      if(W.moved<6){ return; }                 // a tap, not a throw — ignore
      var v=W.vel; if(Math.abs(v)<5){ v=(v<0?-1:1)*5; }
      startInertia(v);
    }
    disc.addEventListener('mousedown',down); disc.addEventListener('touchstart',down,{passive:false});
    window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
    // cleanup on next nav
    wheelCleanup=function(){ window.removeEventListener('mousemove',move); window.removeEventListener('touchmove',move); window.removeEventListener('mouseup',up); window.removeEventListener('touchend',up); };
    W.t0=performance.now();
    function bounceForce(){
      if(W.busy||cur!=='wheel') return;
      var t=(performance.now()-W.t0)/1000, cyc=(t*1.35)%2, p=cyc<1?cyc:2-cyc;
      W.power=0.12+p*0.88;
      var n=el('wneedle'); if(n) n.style.left=(W.power*100)+'%';
      reqRaf(bounceForce);
    }
    bounceForce();
    doFlick=function(){ if(W.busy) return; if(S.freeSpin<=0 && S.coins<20){ go('insufficient'); return; } var dir=Math.random()<0.5?-1:1; startInertia(dir*(18+W.power*36)); };
  };
  var wheelCleanup=null;

  function startInertia(v0){
    var W=wheel; W.busy=true;
    var free=S.freeSpin>0;
    if(free){ S.freeSpin--; } else { S.coins-=20; }
    var wc=el('wcoins'); if(wc) wc.textContent=fmt(S.coins);
    var hint=el('whint'); if(hint) hint.textContent='Winding up…';
    var disc=el('disc'), ptr=el('wptr'), forceEl=mount.querySelector('.wforce');
    if(forceEl) forceEl.classList.add('lock');
    disc.style.transition='none';
    var peak=clamp(v0,-54,54); if(Math.abs(peak)<16) peak=(peak<0?-1:1)*16;
    var sign=peak<0?-1:1; peak=Math.abs(peak);
    var accelMs=160+W.power*260, drag=0.988-(1-W.power)*0.008;
    var last=performance.now(), t0=last, vel=0, phase='accel', lastSeg=segAtTop(W.rot);
    function mark(idx){
      var key=(WHEEL[idx]||{}).key;
      [].forEach.call(mount.querySelectorAll('.pt'),function(c){ c.classList.toggle('hit', c.getAttribute('data-seg')===key); });
    }
    function frame(ts){
      var dt=Math.min((ts-last)/16.67, 2.4); last=ts;
      if(phase==='accel'){
        var u=Math.min(1,(ts-t0)/accelMs);
        vel=sign*peak*u*u*(3-2*u);
        if(u>=1){ vel=sign*peak; phase='coast'; if(hint) hint.textContent='Friction is eating the speed…'; }
      } else {
        vel*=Math.pow(drag, dt);
        if(Math.abs(vel)<7) vel*=Math.pow(0.94, dt);
      }
      W.rot+=vel*dt;
      disc.style.transform='rotate('+W.rot+'deg)';
      var seg=segAtTop(W.rot);
      if(seg!==lastSeg){ lastSeg=seg; mark(seg); if(ptr){ ptr.classList.remove('tick'); void ptr.offsetWidth; ptr.classList.add('tick'); } }
      if(phase==='coast'&&Math.abs(vel)<=0.28) snapSettle(free);
      else reqRaf(frame);
    }
    reqRaf(frame);
  }
  function segAtTop(rot){ var atTop=((-rot)%360+360)%360; return Math.floor(atTop/45)%8; }
  function snapSettle(free){
    var W=wheel, disc=el('disc');
    var idx=segAtTop(W.rot);
    var desired=-(idx*45+22.5);
    var k=Math.round((W.rot-desired)/360);
    var finalR=desired+k*360;
    disc.style.transition='transform .34s cubic-bezier(.2,.8,.3,1)';
    disc.style.transform='rotate('+finalR+'deg)';
    W.rot=finalR;
    setTimeout(function(){
      disc.style.transition='none';
      var out=WHEEL[idx], rnd=nextRnd();
      var row=mount.querySelector('.pt[data-seg="'+out.key+'"]'); if(row) row.classList.add('hit');
      settleWheel(out,rnd,free);
      setTimeout(function(){ W.busy=false; showWheelResult(out,rnd,free); }, 650);
    },360);
  }

  function settleWheel(out,rnd,free){
    S.playsToday++; S.session.plays++; if(!free) S.session.entry+=20;
    var h={icon:'🎲',rnd:rnd,entry:free?0:20};
    if(out.type==='bonus'){ S.bonus+=out.value; S.session.gross+=out.value; h.name='Wheel · '+out.value+' Bonus'; h.prize=out.value; h.kind='plus'; h.st='Bonus · net '+((out.value-(free?0:20))>=0?'+':'')+(out.value-(free?0:20)); }
    else if(out.type==='gift'){ S.kitbag.unshift(out.gift); h.name='Wheel · '+out.gift.name; h.prize=0; h.kind='gift'; h.st='→ Kit Bag'; }
    else if(out.type==='free'){ S.freeSpin+=1; h.name='Wheel · Free spin'; h.prize=0; h.kind='zero'; h.st='+1 free spin'; }
    else { h.name='Wheel · No prize'; h.prize=0; h.kind='zero'; h.st=free?'free spin':'net −20'; }
    S.history.unshift(h); save();
  }

  var wheelRes=null;
  function showWheelResult(out,rnd,free){ wheelRes={out:out,rnd:rnd,free:free}; go('wheelResult'); }
  SCREENS.wheelResult = function(){
    var d=wheelRes, out=d.out, entryTxt=d.free?'Free spin':'−20 Coins';
    if(out.type==='bonus'){
      var netv=out.value-(d.free?0:20);
      return '<div class="body celebrate"><div class="rsic bonus">💠</div>'+
        '<div class="h1" style="margin-top:16px">You won '+out.value+' Bonus!</div>'+
        '<div class="sub">Spin the Wheel · '+(out.value>=100?'the big one':'a solid hit')+'</div>'+
        '<div class="settlecard" style="margin-top:18px">'+
          kv('Entry cost','<span class="v '+(d.free?'':'minus')+' num">'+entryTxt+'</span>')+
          kv('Prize','<span class="v bonus num">+'+out.value+' Bonus</span>')+
          kv('Net change','<span class="v '+(netv>=0?'plus':'minus')+' num">'+(netv>=0?'+':'')+netv+'</span>')+
          kv('Destination','<span class="v bonus">Bonus Coins wallet</span>')+
          kv('Round','<span class="v" style="font-family:ui-monospace,monospace">'+d.rnd+'</span>')+
        '</div><div class="cta" style="margin-top:16px"><div class="btn purple" data-act="wheel">Spin Again</div><div class="altlink" data-act="hub">Return to Games</div></div></div>';
    }
    if(out.type==='gift'){
      return '<div class="body celebrate"><div class="rsic gift">🎁</div>'+
        '<div class="h1" style="margin-top:16px">'+out.gift.rarity+' gift won!</div>'+
        '<div class="sub">'+out.gift.name+' · added to your Kit Bag</div>'+
        '<div class="settlecard" style="margin-top:18px">'+
          kv('Gift','<span class="v">'+out.gift.emoji+' '+out.gift.name+' ×1</span>')+
          kv('Rarity','<span class="v" style="color:'+out.gift.color+'">★ '+out.gift.rarity+'</span>')+
          kv('Entry cost','<span class="v '+(d.free?'':'minus')+' num">'+entryTxt+'</span>')+
          kv('Destination','<span class="v bonus">Kit Bag inventory</span>')+
          kv('Round','<span class="v" style="font-family:ui-monospace,monospace">'+d.rnd+'</span>')+
        '</div><div class="cta" style="margin-top:16px"><div class="btn" data-act="kitbag">View Kit Bag</div><div class="altlink" data-act="wheel">Spin Again</div></div></div>';
    }
    if(out.type==='free'){
      return '<div class="body celebrate"><div class="rsic bonus" style="border-color:rgba(201,255,61,.5);background:radial-gradient(circle at 40% 35%,rgba(201,255,61,.3),transparent)">🔄</div>'+
        '<div class="h1" style="margin-top:16px">Free spin!</div>'+
        '<div class="sub" style="max-width:270px">The wheel stopped on Free Spin — your next spin costs no Coins.</div>'+
        '<div class="settlecard" style="margin-top:18px">'+
          kv('Entry cost','<span class="v '+(d.free?'':'minus')+' num">'+entryTxt+'</span>')+
          kv('Prize','<span class="v plus">+1 free spin</span>')+
          kv('Round','<span class="v" style="font-family:ui-monospace,monospace">'+d.rnd+'</span>')+
        '</div><div class="cta" style="margin-top:16px"><div class="btn purple" data-act="wheel">Use Free Spin</div><div class="altlink" data-act="hub">Return to Games</div></div></div>';
    }
    var netv2=d.free?0:-20;
    return '<div class="body celebrate"><div class="rsic saved">🎯</div>'+
      '<div class="h1" style="margin-top:16px">No prize this spin</div>'+
      '<div class="sub" style="max-width:260px">The wheel stopped on a blank. That’s how chance goes sometimes.</div>'+
      '<div class="settlecard" style="margin-top:18px">'+
        kv('Entry cost','<span class="v '+(d.free?'':'minus')+' num">'+entryTxt+'</span>')+
        kv('Prize','<span class="v num" style="color:var(--t3)">0</span>')+
        kv('Net change','<span class="v minus num">'+netv2+'</span>')+
        kv('New Coin balance','<span class="v num">'+fmt(S.coins)+'</span>')+
      '</div><div class="cta" style="margin-top:16px"><div class="btn ghost" data-act="wheel">Spin Again</div><div class="altlink" data-act="hub">Return to Games</div></div></div>';
  };

  // ---------------- SUPPORT ----------------
  SCREENS.insufficient = function(){
    return '<div class="body celebrate"><div class="rsic saved">🪙</div>'+
      '<div class="h1" style="margin-top:16px">Not enough Coins</div>'+
      '<div class="sub" style="max-width:280px">You need more Coins to play. Top up to keep going'+(S.tickets>0?' — or use your free ticket.':'.')+'</div>'+
      '<div class="settlecard" style="margin-top:18px">'+
        kv('Your balance','<span class="v num">'+fmt(S.coins)+' Coins</span>')+
        kv('Free ticket','<span class="v" style="color:var(--volt)">'+S.tickets+' available</span>')+
      '</div>'+
      '<div class="cta" style="margin-top:16px"><div class="btn coin" data-act="buycoins">Buy Coins (+500)</div>'+(S.tickets>0?'<div class="btn ghost" data-act="useticket">Use Free Ticket</div>':'<div class="altlink" data-act="hub">Back to Games</div>')+'</div></div>';
  };
  SCREENS.limit = function(){
    return '<div class="body celebrate"><div class="rsic saved">🛑</div>'+
      '<div class="h1" style="margin-top:16px">That’s your games for today</div>'+
      '<div class="sub" style="max-width:290px">You’ve reached today’s play limit. A built-in break — games reset tomorrow.</div>'+
      '<div class="settlecard" style="margin-top:18px">'+
        kv('Plays today','<span class="v num">'+S.playsToday+' / '+S.dailyLimit+'</span>')+
        kv('Net today','<span class="v plus num">'+(net()>=0?'+':'')+net()+' Bonus</span>')+
        kv('Resets','<span class="v num">00:00 local</span>')+
      '</div>'+
      '<div class="note bonus" style="margin-top:14px;width:100%">Set a lower personal limit any time in Settings → Responsible Play.</div>'+
      '<div class="cta" style="margin-top:14px"><div class="btn ghost" data-act="history">View History</div><div class="altlink" data-act="hub">Back to Games</div></div></div>';
  };
  SCREENS.history = function(){
    var rows='';
    S.history.forEach(function(h){
      var aTxt,cls=''; if(h.kind==='gift'){aTxt='🎁';cls='gift';} else if(h.prize>0){aTxt='+'+h.prize;} else {aTxt='0';cls='zero';}
      rows+='<div class="hrow"><div class="hi">'+h.icon+'</div><div style="flex:1"><div class="hn">'+h.name+'</div><div class="hd">'+h.rnd+' · '+(h.entry>0?('−'+h.entry+' entry'):'free')+'</div></div><div class="ha '+cls+' num">'+aTxt+'<span class="st">'+(h.st||'')+'</span></div></div>';
    });
    return head('Game history')+'<div class="body"><div class="scroll"><div class="card" style="padding:2px 15px">'+(rows||'<div class="empty">No games played yet.</div>')+'</div><div style="height:6px"></div></div></div>';
  };
  SCREENS.kitbag = function(){
    var rows='';
    S.kitbag.forEach(function(k){ rows+='<div class="kititem"><div class="ke">'+k.emoji+'</div><div><div class="kn">'+k.name+'</div><div class="kr" style="color:'+k.color+'">★ '+k.rarity+'</div></div></div>'; });
    return head('Kit Bag')+'<div class="body"><div class="scroll"><div class="note bonus">🎒 Gifts won from games land here as inventory — not wallet Coins. Use them in live rooms.</div>'+(rows||'<div class="empty">Your Kit Bag is empty. Win gifts on the Wheel!</div>')+'<div style="height:6px"></div></div></div>';
  };

  // ---------------- helpers ----------------
  function el(id){ return document.getElementById(id); }
  function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span>'+v+'</div>'; }
  function setPrompt(t){ var p=el('pprompt'); if(p) p.textContent=t; }
  function perf(){ return (window.performance&&performance.now)?performance.now():Date.now(); }

  // ============================================================
  //  EVENT DELEGATION (clicks / taps)
  // ============================================================
  app.addEventListener('click', function(e){
    var el2=e.target.closest('[data-act]'); if(!el2) return;
    var act=el2.getAttribute('data-act');
    switch(act){
      case 'pentap': break;
      case 'back':
        if(cur==='penaltyResult'||cur==='wheelResult'||cur==='insufficient'||cur==='limit'||cur==='history'||cur==='kitbag'||cur==='penalty'||cur==='wheel') go('hub');
        else if(cur==='rules') go(prevRules||'hub');
        else go('hub');
        break;
      case 'hub': go('hub'); break;
      case 'penalty': go('penalty'); break;
      case 'wheel': go('wheel'); break;
      case 'rules': prevRules=cur; go('rules'); break;
      case 'history': go('history'); break;
      case 'kitbag': go('kitbag'); break;
      case 'spin': if(doFlick) doFlick(); break;
      case 'buycoins': S.coins+=500; save(); toast('+500 Coins added'); go('hub'); break;
      case 'useticket': if(S.tickets>0){ go('penalty'); toast('Free ticket ready — tap to aim'); } break;
    }
  });
  var prevRules=null;

  // wrap go() to run wheel cleanup
  var _go=go;
  go=function(id){ if(wheelCleanup){ wheelCleanup(); wheelCleanup=null; } _go(id); };
  window.addEventListener('resize', function(){ if(cur==='penalty' && pen.phase!=='strike'){ layoutPenalty(); } });

  // public API
  window.SFL = {
    go:function(id){ go(id); },
    reset:function(){ S=clone(DEFAULT); save(); go('hub'); toast('Balances reset'); },
    giveCoins:function(){ S.coins+=500; save(); go(cur); toast('+500 Coins'); }
  };

  render();
})();
</script>
