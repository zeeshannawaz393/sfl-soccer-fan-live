name: Build & Deploy to cPanel (SSH)

on:
  push:
    branches: [main]
    paths:
      - 'screens/**'
      - 'build/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build prototype
        run: python build/build_proto.py

      - name: Stage deploy folder (single self-contained file as index.html)
        run: |
          mkdir -p dist
          cp screens/sfl-prototype.html dist/index.html
          # NOTE: only index.html is deployed — no .htaccess, so existing SSL/redirect rules are never overwritten
          ls -la dist

      - name: Deploy over SSH (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # upload index.html + .htaccess; do NOT delete other files in the doc root
          rsync -avz \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
