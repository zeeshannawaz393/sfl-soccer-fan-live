<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; margin: 0; padding: 14px; color: #14161c; }
  h3 { margin: 0 0 8px; font-size: 13px; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; border: 1.5px solid #e6e8ef; border-radius: 8px; padding: 8px; font-size: 11px; font-family: ui-monospace, monospace; resize: none; }
  button { margin-top: 10px; width: 100%; height: 38px; border: 0; border-radius: 8px; background: linear-gradient(140deg,#0FB753,#7CD843); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 8px; font-size: 11px; color: #707786; min-height: 14px; }
</style>
<h3>Copied a screen? Just click below.</h3>
<button id="paste">📋 Paste from clipboard &amp; Rebuild</button>
<details style="margin-top:10px"><summary style="font-size:11px;color:#707786;cursor:pointer">or paste JSON manually</summary>
<textarea id="json" placeholder='{"version":1,"root":{...}}'></textarea>
<button id="go" style="background:#14161c">Rebuild from box</button>
</details>
<div class="status" id="status"></div>
<script>
  const ta = document.getElementById('json');
  const btn = document.getElementById('go');
  const pasteBtn = document.getElementById('paste');
  const status = document.getElementById('status');
  function send(json) {
    if (!json || !json.trim()) { status.textContent = 'Nothing to import — copy a screen first.'; return; }
    btn.disabled = true; pasteBtn.disabled = true; status.textContent = 'Working…';
    parent.postMessage({ pluginMessage: { type: 'import', json: json } }, '*');
  }
  pasteBtn.onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      send(text);
    } catch (e) {
      status.textContent = 'Clipboard blocked — open the box below and paste manually.';
    }
  };
  btn.onclick = () => send(ta.value);
  onmessage = (e) => {
    const m = e.data.pluginMessage; if (!m) return;
    status.textContent = m.message || '';
    if (m.type === 'done' || m.type === 'error') btn.disabled = false;
  };
</script>
